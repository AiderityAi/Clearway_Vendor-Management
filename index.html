<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>VMA Training Guide &amp; Cheat Sheet</title>
<style>
:root{--bg:#f6f8fb;--card:#fff;--tx:#17202e;--mu:#5b6778;--bd:#d8dfe8;--ac:#1f3a5f;--ac2:#0f766e;--note:#fff4d6;--noteb:#d99a00;--ok:#e3f6ee;--bad:#fde8e8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#0f1520;--card:#182131;--tx:#e8edf5;--mu:#9aa7ba;--bd:#2a3649;--ac:#8fb4ea;--ac2:#4fd1c0;--note:#3a3014;--noteb:#e0a800;--ok:#123a2c;--bad:#40181a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
header{padding:20px 16px 8px;max-width:1000px;margin:auto}h1{margin:0;font-size:1.5rem;color:var(--ac)}.sub{color:var(--mu);font-size:.9rem}
nav{display:flex;gap:6px;flex-wrap:wrap;max-width:1000px;margin:8px auto;padding:0 16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg)}
nav button,.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:8px;cursor:pointer;font:inherit}nav button.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
main{max-width:1000px;margin:auto;padding:8px 16px 60px}.pane{display:none}.pane.on{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
.card h3,h2,h4{color:var(--ac2);margin:.2em 0 .5em}h4{font-size:1rem}.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.92rem}th{background:var(--ac);color:var(--bg);text-align:left}th,td{padding:6px 9px;border:1px solid var(--bd)}
.note{background:var(--note);border-left:5px solid var(--noteb);padding:10px 12px;border-radius:6px;margin:10px 0;font-weight:600}
label.ck{display:flex;gap:8px;padding:3px 0;cursor:pointer}label.ck input{margin-top:5px}label.ck.done span{text-decoration:line-through;color:var(--mu)}
details{background:var(--card);border:1px solid var(--bd);border-radius:10px;margin-bottom:10px}summary{padding:12px 14px;font-weight:700;cursor:pointer;color:var(--ac)}details>div{padding:0 14px 12px}

.bar{height:8px;background:var(--bd);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--ac2)}
.res{padding:12px;border-radius:8px;background:var(--ok);margin-top:8px;font-weight:600}.res.bad{background:var(--bad)}
.opt{display:block;width:100%;text-align:left;margin:5px 0}.opt.right{background:var(--ok)}.opt.wrong{background:var(--bad)}pre{white-space:pre-wrap;font:inherit;margin:0}
@media print{nav,.btn{display:none}.pane{display:block!important}details{display:block}}
</style></head><body>
<header><h1>Vendor Management Analyst: Training Guide &amp; Cheat Sheet</h1><div class="sub">Controlling source: Master Playbook v5_LH · Accurate processing, complete evidence, correct approvals, audit-ready record.</div></header>

<script>
const D={"sections":[{"id":"s1","title":"1. Daily Operating Schedule","blocks":[{"t":"note","text":"Golden Rule: never approve a supplier simply because the form looks complete. Validate controls, retain evidence, document exceptions, get required approvals."},{"t":"h","text":"If a control fails"},{"t":"steps","items":["Stop the affected processing step.","Document the issue.","Request corrected documentation or information.","Escalate when required.","Resume only after the issue is resolved."]},{"t":"h","text":"Daily schedule"},{"t":"table","head":["Time","Required activity"],"rows":[["8:00 AM","Review Vendor Management Queue, Supplier Enablement Queue, VM Rush Queue, assigned emails"],["8:30 AM","Review assignment distribution and prioritize work"],["12:00 PM","Complete and submit morning assignments"],["3:00 PM","Complete morning approvals, S/4 keying, supervisor approvals, director review when required"],["Before EOD","Recheck VM Rush and complete daily closure"]]},{"t":"h","text":"Morning queue checklist"},{"t":"check","items":["Open Vendor Management Queue","Open Supplier Enablement Queue","Open VM Rush Queue","Review personal assigned emails","Identify urgent and time-sensitive requests","Identify banking changes and supplier approvals","Review outstanding corrections and audits","Record items requiring escalation"]},{"t":"h","text":"Work prioritization"},{"t":"steps","items":["VM Rush","Banking changes","Supplier approvals","Supplier updates","Reporting and projects"]},{"t":"h","text":"Queue coverage rotation"},{"t":"table","head":["Team member","Coverage"],"rows":[["Alona","7:30 AM–11:30 AM"],["Onna","11:30 AM–2:30 PM"],["Roopsika","2:30 PM–5:00 PM"]]},{"t":"h","text":"End-of-day closure"},{"t":"check","items":["All assigned forms completed or appropriately documented","VM Rush reviewed and completed","Team chat updated","Stalled items documented","Escalations submitted","Audit evidence attached","Outstanding work identified for follow-up"]}]},{"id":"s2","title":"2. Classify the Request","blocks":[{"t":"table","head":["Request type","Processing path"],"rows":[["New Non-PO supplier","Non-PO workflow"],["New PO supplier","PO workflow"],["Supplier update","Maintenance workflow"],["Banking change","Banking validation"],["Tax change","TIN validation"],["Foreign supplier","W-8 workflow"],["Tax-exempt supplier","501(c)(3) workflow"],["Enablement issue","Ariba workflow"]]},{"t":"p","text":"Also identify: PO or Non-PO; tax exempt or taxable; domestic or foreign; onsite or offsite; ISN or Non-ISN. Classification determines the validation path and documentation required."},{"t":"h","text":"Initial document package: Non-PO"},{"t":"check","items":["Supplier form","W-9","EFT authorization form","Bank letter or voided check"]},{"t":"h","text":"Initial document package: PO"},{"t":"check","items":["Supplier registration","W-9 or W-8","Banking documentation","Insurance documentation","Safety documentation, if required","Procurement approval"]}]},{"id":"s3","title":"3. Required Validation Sequence","blocks":[{"t":"steps","items":["Tax validation","Banking validation","Code of Conduct","ESG questionnaire","Insurance review","Safety review","Business Partner validation","Supplier enablement","Audit documentation review","Approval"]},{"t":"note","text":"Do not bypass required validation steps."}]},{"id":"s4","title":"4. Tax Validation (W-9 and TINCheck)","blocks":[{"t":"h","text":"Step 1: Review the W-9"},{"t":"check","items":["Current IRS W-9 version","Signed","Dated","Legal name on Line 1","DBA on Line 2, when applicable","Correct taxpayer identification type","Supplier classification supports the tax information"]},{"t":"h","text":"Step 2: Run TINCheck"},{"t":"p","text":"Enter exactly the W-9 Line 1 legal name and the tax identification number. Never substitute DBA, AKA, FKA, NKA, nicknames, or alternate business names."},{"t":"note","text":"Most common failure: incorrect legal name on Line 1, not an invalid tax ID."},{"t":"h","text":"Step 3: Respond to the result"},{"t":"table","head":["Finding","Required action"],"rows":[["Name/TIN mismatch","Request a new W-9"],["DBA entered on Line 1","Request corrected W-9"],["Disregarded entity issue","Owner name required"],["ITIN submitted","Escalate to AP Leadership"],["Unsigned W-9","Reject or return"]]},{"t":"note","text":"Do not approve a failed tax validation."},{"t":"h","text":"Tax-exempt supplier (501(c)(3))"},{"t":"steps","items":["TINCheck","GuideStar verification","Address validation","Banking validation","Documentation notes"]},{"t":"p","text":"Retain: GuideStar screenshot, address validation evidence, TINCheck result, W-9."},{"t":"h","text":"Foreign suppliers"},{"t":"p","text":"Use the W-8 workflow. For applicable international banking relationships use the IBAN validation process rather than starting with domestic AVS/Penny Test."},{"t":"h","text":"Canadian W-8BEN-E review"},{"t":"check","items":["Canada listed","CRA Business Number present","FATCA status complete","Treaty country = Canada","Limitation on Benefits (LOB) checked","Line 15 completed for services, when applicable","Signed and dated"]},{"t":"note","text":"Do not request a U.S. EIN solely because the supplier is Canadian. Treaty questions go to Tax/AP Leadership."}]},{"id":"s5","title":"5. Banking Validation","blocks":[{"t":"table","head":["Supplier type","Validation method","Profile"],"rows":[["Non-PO","AVS","Clearway01"],["PO","Penny Test","Clearway03"],["Failed Penny Test","Confidence/Challenge Test","Clearway02"]]},{"t":"note","text":"Do not use the wrong validation path."},{"t":"h","text":"A. Non-PO: AVS procedure"},{"t":"p","text":"Required: EFT Authorization Form; bank letter OR voided check; latest Ariba submission."},{"t":"steps","items":["Confirm all required banking documents are received","Compare the legal organization name","Confirm the routing number","Confirm the account number","Enter the legal organization name in Clearway01","Enter the exact routing and account numbers","Leave address fields blank","Execute AVS validation","Save a screenshot","Document the result"]},{"t":"p","text":"Decision: documentation matches submission → approve validation. Documentation differs → reject and request correction."},{"t":"h","text":"B. PO: Penny Test procedure"},{"t":"steps","items":["Open Clearway03","Enter the legal organization name","Enter the routing number","Enter the account number","Submit the Penny Test","Immediately capture the Request ID","Save the Request ID in the Tracking Log, Form Notes, and Audit Form","Monitor the test status","Save the screenshot and supporting evidence"]},{"t":"h","text":"Penny Test status response"},{"t":"table","head":["Status","Action"],"rows":[["Processing","Wait"],["Completed","Approve"],["Processing Error","Resubmit"],["Failed","Use Clearway02 Confidence/Challenge Test"]]},{"t":"h","text":"Callback procedure"},{"t":"p","text":"Use only when the Penny Test is delayed and the supplier is business-critical."},{"t":"steps","items":["Contact Treasury or Accounting","Verify the routing number","Verify the account number","Obtain a confirmation email","Attach the evidence to SAP"]},{"t":"note","text":"The Penny Test must still be completed later."},{"t":"h","text":"Fraud prevention: immediate escalation to Supervisor and Director"},{"t":"list","items":["Banking changes from Gmail or Yahoo accounts","Spoofed email indicators","Returned deposits","Supplier refusal to complete callback","Supplier inability to verify deposits twice"]},{"t":"note","text":"Do not independently dismiss suspected banking fraud."}]},{"id":"s6","title":"6. Code of Conduct and ESG","blocks":[{"t":"check","items":["Code of Conduct acceptance reviewed","ESG questionnaire reviewed","Evidence retained","Missing or incomplete items documented and followed up"]},{"t":"p","text":"The v5 playbook names these as required review controls but gives no detailed scoring criteria or separate ESG approval matrix."}]},{"id":"s7","title":"7. Insurance Review","blocks":[{"t":"h","text":"ISN supplier"},{"t":"p","text":"Insurance syncs automatically, but analyst review is still required."},{"t":"check","items":["Insurance approved","Sync complete","No open issues"]},{"t":"h","text":"Non-ISN supplier"},{"t":"p","text":"Required: Modular Insurance Questionnaire, Certificate of Insurance (COI), risk review."},{"t":"check","items":["General Liability (GL)","Auto coverage","Workers Compensation","Coverage limits","Expiration dates","Additional Insured status","Services covered"]},{"t":"table","head":["Finding","Action"],"rows":[["No insurance","Hold"],["Expired insurance","Hold"],["Missing Additional Insured","Return"],["Insufficient coverage","Return"],["Insurance exception","Escalate to Risk Team"]]}]},{"id":"s8","title":"8. Safety Compliance","blocks":[{"t":"p","text":"Required for onsite suppliers and suppliers with more than 10 employees. Non-ISN: Safety Questionnaire, OSHA logs (3 years), EMR/EMDR records (3 years). ISN: auto-synced; confirm status."},{"t":"check","items":["Onsite/offsite status identified","Employee count considered","OSHA logs reviewed, when required","EMR/EMDR reviewed, when required","Safety questionnaire reviewed","Safety approval confirmed","Evidence retained"]},{"t":"note","text":"Escalate high incident rates, missing OSHA logs, or safety concerns to EHS."}]},{"id":"s9","title":"9. Business Partner (BP) Review and Manual Creation","blocks":[{"t":"p","text":"Use manual BP creation when ECC supplier migration to S/4 fails. Source of truth: 1) ECC, 2) Coupa. Do not add or change supplier information without approved documentation."},{"t":"h","text":"Review ECC"},{"t":"check","items":["Vendor number","Tax ID","Banking","Contacts"]},{"t":"h","text":"Review Coupa"},{"t":"check","items":["Payment terms","Insurance","Incoterms","Supplier type"]},{"t":"h","text":"S/4 setup controls"},{"t":"check","items":["Create Business Partner","Extend company code 3505","Add applicable purchasing organizations (1000, 2000, 3000, 4000, 5000, 6000)","Currency = USD","Incoterms required","Address Valid From = 01/01/1900","FI role present (FLVN00)","Purchasing role present (FLVN01 for PO suppliers)","Correct supplier type","Save and confirm no errors"]},{"t":"note","text":"The 01/01/1900 Valid From date is a frequent cause of Ariba synchronization failure."}]},{"id":"s10","title":"10. Ariba Supplier Enablement","blocks":[{"t":"check","items":["Correct ANID","TRR sent","TRR accepted","PO task assigned","Invoice task assigned","Supplier role assigned"]},{"t":"h","text":"Supplier says “I can’t see my PO”: check in order"},{"t":"steps","items":["Confirm TRR accepted","Confirm tasks assigned","Confirm supplier roles assigned","Change date filter to 365 days"]},{"t":"table","head":["Problem","Action / escalation"],"rows":[["ANID conflict","Enablement Team"],["Integration failure","Cognitus"],["Missing tasks","Assign required tasks"],["PO not visible","TRR, tasks, roles, 365-day filter"],["Valid From date issue","Review BP setup"]]}]},{"id":"s11","title":"11. Final Approval Checklist","blocks":[{"t":"check","items":["Tax validation passed","Banking validation passed","Code of Conduct reviewed","ESG questionnaire reviewed","Insurance passed","Safety passed, when required","BP created or updated","Correct company code","Purchasing organization validated","ANID linked","TRR accepted","Invoice tasks assigned","PO tasks assigned, when applicable","Documentation attached","Notes completed","Screenshots attached","Required approvals completed"]},{"t":"note","text":"Ask yourself: “Do I have enough documentation to defend this approval during a SOX audit?” If not, stop and obtain the missing evidence."}]},{"id":"s12","title":"12. SAP Reports and T-Codes","blocks":[{"t":"table","head":["Report / T-code","Purpose","Frequency"],"rows":[["ME5A","Purchase requisitions: validate demand, research requesters","Every morning"],["ME2N","Purchase orders: PO activity, open POs, history","Daily"],["ME3M","Contracts: contract dates, procurement validation","As needed"],["ZMM_PROC_LIFECYCLE","P2P lifecycle: request, requisition, PO, invoice","Daily"],["ZMMAQ_VOPEN","Open POs: disputes, missing invoice claims","Daily"],["ZMPLANTBL","Inventory research","As needed"],["ZDMPN","Manufacturer parts","As needed"]]},{"t":"p","text":"Morning routine: ME5A, ME2N, ZMM_PROC_LIFECYCLE, ZMMAQ_VOPEN. To run: open SAP Launchpad, search the report, apply filters, execute, export, save a Variant when appropriate. Exact filter values and variants are not specified in v5; confirm with your supervisor."}]},{"id":"s13","title":"13. Escalation Matrix","blocks":[{"t":"table","head":["Issue","Escalate to"],"rows":[["ITIN","AP Leadership"],["Treaty questions","Tax/AP Leadership"],["Failed Challenge Test","Supervisor + Director"],["Fraud concern","Supervisor + Director"],["Integration failure","Cognitus"],["Duplicate BP","Supervisor"],["ANID conflict","Enablement Team"],["Legal exception","Legal Team"],["Safety concern","EHS"],["Insurance exception","Risk Team"]]},{"t":"p","text":"Always include: supplier name, request type, issue, action already taken, supporting evidence, and the decision or assistance needed."}]},{"id":"s15","title":"14. Daily Work Tracker (suggested fields)","blocks":[{"t":"p","text":"Suggested, not mandatory per v5: Date received · Supplier name · Supplier ID/BP · Request type · Assigned analyst · Priority · Tax status · Banking method · Banking status · Penny Test Request ID · Code of Conduct · ESG · Insurance · Safety · BP status · Ariba status · Outstanding item · Escalation owner · Last follow-up · Evidence complete · Approval status · Closure date."},{"t":"h","text":"Efficiency practices"},{"t":"list","items":["Classify the request immediately to avoid rework","Review all submitted documents together before validating","Use the correct banking profile for PO vs Non-PO","Capture the Penny Test Request ID immediately","Record issues and missing documents as soon as identified","Use the email templates","Run daily reports consistently","Attach evidence as each validation completes","Escalate control failures promptly","Review VM Rush again before signoff"]},{"t":"h","text":"Confirm with leadership before treating as standard"},{"t":"list","items":["SLA targets per request type","SAP report filter values and variants","Email distribution lists and recipients","Screen-by-screen BP creation navigation","Insurance coverage thresholds","Detailed ESG acceptance criteria","Complete Ariba integration troubleshooting sequence"]},{"t":"note","text":"Do not invent these values or substitute informal practices for approved procedures."}]}],"emails":[["A. W-9 rejection / correction","Updated W-9 Required","During the tax validation review, we were unable to validate the legal name and Tax ID combination submitted on the W-9.\n\nPlease provide an updated signed W-9 reflecting the IRS legal name exactly as registered with the IRS. Once received, we will re-run validation and continue processing your supplier request."],["B. Banking callback confirmation","Banking Information Confirmation Required","As part of our supplier banking verification process, please confirm the bank account information recently submitted to Clearway.\n\nPlease reply confirming that the account and routing information provided are accurate and authorized for payment processing. Once confirmed, we will continue processing your supplier request."],["C. Missing insurance","Insurance Documentation Required","Your supplier onboarding request is currently pending due to missing or incomplete insurance documentation.\n\nPlease provide the requested Certificate of Insurance and any supporting documentation so we may continue processing."],["D. Missing banking","Banking Documentation Required","Your supplier request is currently pending banking validation.\n\nPlease provide a current bank letter or voided check along with completed EFT documentation. Once received, we will continue processing your request."],["E. Missing W-8 information","Updated W-8BEN-E Required","During review of the W-8BEN-E submitted, we identified missing or incomplete information required for validation.\n\nPlease review and update the treaty claim, FATCA certification, and signature sections before resubmitting."]],"cheat":[{"h":"Banking path","head":["Supplier","Method","Profile"],"rows":[["Non-PO","AVS (address blank)","Clearway01"],["PO","Penny Test (save Request ID)","Clearway03"],["Failed Penny","Confidence/Challenge","Clearway02"]]},{"h":"Penny Test status","head":["Status","Action"],"rows":[["Processing","Wait"],["Completed","Approve"],["Processing Error","Resubmit"],["Failed","Clearway02"]]},{"h":"W-9 / TINCheck findings","head":["Finding","Action"],"rows":[["Name/TIN mismatch","New W-9"],["DBA on Line 1","Corrected W-9"],["Disregarded entity","Owner name"],["ITIN","AP Leadership"],["Unsigned","Reject/return"]]},{"h":"Insurance findings","head":["Finding","Action"],"rows":[["None / expired","Hold"],["No Additional Insured","Return"],["Insufficient coverage","Return"],["Exception","Risk Team"]]},{"h":"Escalate to","head":["Issue","Owner"],"rows":[["ITIN","AP Leadership"],["Treaty","Tax/AP Leadership"],["Failed Challenge / Fraud","Supervisor + Director"],["Integration failure","Cognitus"],["Duplicate BP","Supervisor"],["ANID conflict","Enablement Team"],["Legal","Legal Team"],["Safety","EHS"],["Insurance exception","Risk Team"]]},{"h":"Key values","head":["Item","Value"],"rows":[["Company code","3505"],["Purch. orgs","1000–6000"],["Currency","USD"],["Address Valid From","01/01/1900"],["Roles","FLVN00; FLVN01 (PO)"],["Safety needed","Onsite or >10 employees"],["OSHA / EMR","3 years"]]},{"h":"“I can’t see my PO”","head":["Order","Check"],"rows":[["1","TRR accepted"],["2","Tasks assigned"],["3","Supplier roles assigned"],["4","Date filter = 365 days"]]},{"h":"Fraud triggers: escalate now","head":["Trigger"],"rows":[["Gmail/Yahoo banking change"],["Spoofed email indicators"],["Returned deposits"],["Refuses callback"],["Cannot verify deposits twice"]]}],"quiz":[["A PO supplier’s bank validation is needed. Which profile and method?",["Clearway01 / AVS","Clearway03 / Penny Test","Clearway02 / Challenge Test"],1],["TINCheck fails because the supplier entered their DBA on Line 1. What do you do?",["Run TINCheck with the DBA","Request a corrected W-9","Approve with a note"],1],["A banking change arrives from a Gmail account. What now?",["Process it if documents match","Escalate to Supervisor and Director","Ask the supplier to resend from Yahoo"],1],["A Penny Test returns Failed. Next step?",["Resubmit in Clearway03","Callback only, then approve","Clearway02 Confidence/Challenge Test"],2],["A supplier submits an ITIN. Who gets the escalation?",["AP Leadership","Risk Team","EHS"],0],["Which BP field is a frequent cause of Ariba sync failure?",["Currency = USD","Address Valid From not 01/01/1900","Company code 3505"],1],["Supplier cannot see a PO. What do you check first?",["365-day date filter","TRR accepted","Supplier roles"],1],["A Non-PO AVS run: what do you do with address fields?",["Enter the remit-to address","Copy from W-9","Leave them blank"],2],["A Canadian supplier sends a W-8BEN-E. Do you request a U.S. EIN?",["Yes, always","No, not solely because they are Canadian","Only for services"],1],["Safety review is required for which suppliers?",["Onsite or more than 10 employees","All suppliers","Foreign suppliers only"],0]]};
const $=(s,r=document)=>r.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let store={};try{store=JSON.parse(localStorage.getItem('vma')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('vma',JSON.stringify(store))}catch(e){}};
const tab=(h,r)=>'<div class="tw"><table><tr>'+h.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr>'+r.map(a=>'<tr>'+a.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</table></div>';
let ck=0;
function blk(b){switch(b.t){
case 'p':return '<p>'+esc(b.text)+'</p>';case 'h':return '<h4>'+esc(b.text)+'</h4>';case 'note':return '<div class="note">'+esc(b.text)+'</div>';
case 'list':return '<ul>'+b.items.map(i=>'<li>'+esc(i)+'</li>').join('')+'</ul>';case 'steps':return '<ol>'+b.items.map(i=>'<li>'+esc(i)+'</li>').join('')+'</ol>';
case 'table':return tab(b.head,b.rows);
case 'check':return b.items.map(i=>{const id='c'+ck++;return '<label class="ck'+(store[id]?' done':'')+'"><input type="checkbox" data-id="'+id+'"'+(store[id]?' checked':'')+'><span>'+esc(i)+'</span></label>'}).join('')}}
const tabs=[['cheat','Cheat Sheet'],['guide','Guide'],['tools','Quick Tools'],['emails','Templates'],['quiz','Quiz']];
$('#nav').innerHTML=tabs.map(t=>'<button data-t="'+t[0]+'">'+t[1]+'</button>').join('')+'<button class="btn" id="print">Print</button>';
const cheat='<div class="grid">'+D.cheat.map(c=>'<div class="card"><h3>'+esc(c.h)+'</h3>'+tab(c.head,c.rows)+'</div>').join('')+'</div>';
const guide='<div class="card"><b>Checklist progress</b> <span id="pt"></span><div class="bar"><i id="pb"></i></div><button class="btn" id="reset" style="margin-top:8px">Reset checklists</button><input type="search" id="q" placeholder="Search the guide (e.g. Penny, TRR, W-9)"></div><div id="secs">'+D.sections.map(s=>'<details data-s="'+esc(JSON.stringify(s)).toLowerCase()+'"><summary>'+esc(s.title)+'</summary><div>'+s.blocks.map(blk).join('')+'</div></details>').join('')+'</div>';
const lk=[];D.cheat.forEach(c=>{if(c.rows[0].length>1)c.rows.forEach(r=>lk.push([c.h,r[0],r.slice(1).join(' → ')]))});
const cats=[...new Set(lk.map(x=>x[0]))];
const tools='<div class="card"><h3>Banking path finder</h3><select id="bt"><option value="">Select supplier type…</option><option value="n">Non-PO</option><option value="p">PO</option><option value="f">PO: Penny Test failed</option></select><div id="br"></div></div>'+
'<div class="card"><h3>Finding → action lookup</h3><select id="lc">'+cats.map(c=>'<option>'+esc(c)+'</option>').join('')+'</select><select id="li"></select><div id="lr"></div></div>'+
'<div class="card"><h3>Is a safety review required?</h3><label class="ck"><input type="checkbox" id="on"><span>Supplier works onsite</span></label><label class="ck"><input type="checkbox" id="e10"><span>More than 10 employees</span></label><div id="sr" class="res bad">Not required by these criteria. Confirm ISN status if applicable.</div></div>';
const emails=D.emails.map((e,i)=>'<div class="card"><h3>'+esc(e[0])+'</h3><b>Subject: '+esc(e[1])+'</b><pre id="em'+i+'">Hello,\n\n'+esc(e[2])+'\n\nThank you,\nVendor Management Team</pre><button class="btn" data-copy="'+i+'" style="margin-top:8px">Copy</button></div>').join('')+'<p class="sub">Confirm the correct recipient and supplier/request details before sending.</p>';
const quiz='<div id="qz"></div>';
$('#main').innerHTML=[['cheat',cheat],['guide',guide],['tools',tools],['emails',emails],['quiz',quiz]].map(p=>'<section class="pane" id="p-'+p[0]+'">'+p[1]+'</section>').join('');
function show(t){document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id==='p-'+t));document.querySelectorAll('#nav button[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===t));if(location.hash!=='#'+t)history.replaceState(null,'','#'+t)}
$('#nav').onclick=e=>{const t=e.target.dataset.t;if(t)show(t)};$('#print').onclick=()=>window.print();
const h=location.hash.slice(1);show(tabs.some(t=>t[0]===h)?h:'cheat');
function prog(){const a=[...document.querySelectorAll('#secs input[type=checkbox]')],n=a.filter(x=>x.checked).length;$('#pt').textContent=n+' / '+a.length;$('#pb').style.width=(a.length?n/a.length*100:0)+'%'}
$('#secs').onchange=e=>{const i=e.target.dataset.id;if(!i)return;store[i]=e.target.checked;e.target.parentNode.classList.toggle('done',e.target.checked);save();prog()};
$('#reset').onclick=()=>{store={};save();document.querySelectorAll('#secs input').forEach(x=>{x.checked=false;x.parentNode.classList.remove('done')});prog()};prog();
$('#q').oninput=e=>{const v=e.target.value.toLowerCase();document.querySelectorAll('#secs details').forEach(d=>{const m=!v||d.dataset.s.includes(v);d.style.display=m?'':'none';d.open=!!v&&m})};
const BK={n:['Non-PO → AVS in <b>Clearway01</b>','Docs: EFT form, bank letter or voided check, latest Ariba submission','Match legal org name, routing, account','Enter exact routing and account; leave address blank','Run AVS, save screenshot, document result','Matches → approve. Differs → reject and request correction'],p:['PO → Penny Test in <b>Clearway03</b>','Enter legal org name, routing, account; submit','Immediately capture Request ID → Tracking Log, Form Notes, Audit Form','Monitor: Processing = wait · Completed = approve · Processing Error = resubmit','Save screenshot and evidence','Delayed and business-critical? Callback via Treasury/Accounting, then still complete the Penny Test later'],f:['Failed Penny Test → <b>Clearway02</b> Confidence/Challenge Test','A failed Challenge Test goes to Supervisor + Director','Fraud flags (Gmail/Yahoo, spoofing, returned deposits, refused callback) escalate immediately']};
$('#bt').onchange=e=>{$('#br').innerHTML=e.target.value?'<ol>'+BK[e.target.value].map(x=>'<li>'+x+'</li>').join('')+'</ol>':''};
function fillLi(){const c=$('#lc').value;$('#li').innerHTML=lk.filter(x=>x[0]===c).map((x,i)=>'<option value="'+esc(x[2])+'">'+esc(x[1])+'</option>').join('');$('#lr').innerHTML='<div class="res">'+esc($('#li').value)+'</div>'}
$('#lc').onchange=fillLi;$('#li').onchange=()=>{$('#lr').innerHTML='<div class="res">'+esc($('#li').value)+'</div>'};fillLi();
function sf(){const r=$('#on').checked||$('#e10').checked,s=$('#sr');s.className='res'+(r?'':' bad');s.textContent=r?'Safety review required: Non-ISN needs Safety Questionnaire, 3 yrs OSHA logs, 3 yrs EMR/EMDR. ISN: confirm auto-synced status.':'Not required by these criteria. Confirm ISN status if applicable.'}
$('#on').onchange=sf;$('#e10').onchange=sf;
document.addEventListener('click',e=>{const c=e.target.dataset.copy;if(c!==undefined){const t=$('#em'+c).textContent;try{navigator.clipboard.writeText(t);e.target.textContent='Copied'}catch(x){e.target.textContent='Select text and copy'}setTimeout(()=>e.target.textContent='Copy',1500)}});
let qi=0,sc=0;function qr(){const z=$('#qz');if(qi>=D.quiz.length){z.innerHTML='<div class="card"><h3>Score: '+sc+' / '+D.quiz.length+'</h3><p>'+(sc>=9?'Excellent. Audit-ready.':sc>=7?'Solid. Review the missed topics in the Guide.':'Review the Cheat Sheet and try again.')+'</p><button class="btn" id="rq">Retake</button></div>';$('#rq').onclick=()=>{qi=0;sc=0;qr()};return}
const q=D.quiz[qi];z.innerHTML='<div class="card"><div class="sub">Question '+(qi+1)+' of '+D.quiz.length+'</div><h3>'+esc(q[0])+'</h3>'+q[1].map((o,i)=>'<button class="btn opt" data-o="'+i+'">'+esc(o)+'</button>').join('')+'<div id="qf"></div></div>';
z.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.o,ok=i===q[2];if(ok)sc++;z.querySelectorAll('.opt').forEach((x,j)=>{x.disabled=true;if(j===q[2])x.classList.add('right');else if(j===i)x.classList.add('wrong')});$('#qf').innerHTML='<div class="res'+(ok?'':' bad')+'">'+(ok?'Correct.':'Not quite. Answer: '+esc(q[1][q[2]]))+'</div><button class="btn" id="nx" style="margin-top:8px">Next</button>';$('#nx').onclick=()=>{qi++;qr()}})}
qr();
</script></body></html>
